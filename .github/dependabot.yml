version: 2

# Policy:
#   - Weekly schedule (axios + Kong 2024 pattern: malicious dep ships, every
#     instant-merging adopter eats it within 5 minutes).
#   - Group dev-deps patches into a single PR.
#   - Ignore semver-major across the board — every major bump is a human
#     review (security regressions tend to ride along on major upgrades).
#   - github-actions ecosystem included; auto-merge workflow refuses to
#     merge these (they're code-execution changes).
#   - Cooldown on every ecosystem: a brand-new release is not proposed until
#     it has been public for a week. This is the native mechanism for the
#     weekly-schedule reasoning above — a compromised version published an
#     hour ago never reaches a PR here, so the window in which we could adopt
#     it is the window in which the registry has already yanked it.

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      dev-deps-patch:
        dependency-type: development
        update-types:
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
