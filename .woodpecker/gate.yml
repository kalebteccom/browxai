# ci-optimised: v1
# Woodpecker is the only CI for this repo; the one GitHub workflow left is release.yml (OIDC publish). secret-scan and zizmor download pinned release binaries into a host cache (neither tool ships in a node image).
# INVARIANT: every heavy command goes through scripts/gate-slot.sh, which draws from the slot pool shared with trackxai and remotxai. No step builds an image; images are pulled by exact tag.
# SPLIT: the real-browser keystones live in browser.yml (label browser: "true", run by the browser-runner agent); this file has no label, runs on the general agents and runs in parallel with it.
# The repo is public, so Woodpecker never runs pull_request events; a branch is gated by the pipeline of its push. GATE vs MAIN: every gate step runs on pushes to any branch except main, once, before the merge. A push to main runs only `main-check`: the squash merge landed a tree that was gated at the same head, so nothing is rebuilt.
when:
  - event: push
# SHAPE: `install` runs once and every other step depends only on it, so typecheck, lint, format, both unit runs, static checks, supply-chain checks and the package build run side by side on the shared workspace (the slot pool caps how many heavy commands run at once). Steps merge the `install` step (`<<: *step`) and override name, depends_on, commands.
# No installed dependency is bound to the Node ABI: install scripts are off (.npmrc) and the only native code, sharp, ships Node-API prebuilds as per-platform packages; so one install under Node 22 serves the Node 26 steps.
# Node 22 is the declared floor in `engines` (the Safari BiDi client uses Node's global WebSocket); 26 is what development runs on. The unit suite runs on both. It is not sharded: it takes 0.4 to 0.7 min, so shards would only add slot churn.
# WORKAROUND: the trackxai-ci images carry pnpm 9.15.9 but package.json pins pnpm@9.0.0, so plain node images plus corepack honour `packageManager`. The store location comes from an env var, so no step runs `pnpm config set`.
steps:
  - &step
    name: install
    image: node:22-bookworm
    depends_on: []
    when: &gate-when
      - event: push
        branch:
          exclude: [main]
    volumes:
      - /home/gitops/cache/browxai/pnpm-store:/pnpm-store
      - /home/gitops/cache/browxai/corepack:/corepack
      - /srv/trackxai-gate-locks:/srv/trackxai-gate-locks
    environment:
      COREPACK_HOME: /corepack
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      npm_config_store_dir: /pnpm-store
    commands:
      - corepack enable
      - bash scripts/gate-slot.sh pnpm install --frozen-lockfile
  - <<: *step
    name: typecheck
    depends_on: [install]
    commands:
      - corepack enable
      - bash scripts/gate-slot.sh pnpm typecheck
  - <<: *step
    name: test-node22
    depends_on: [install]
    commands:
      - corepack enable
      - bash scripts/gate-slot.sh pnpm test
  - <<: *step
    name: test-node26
    # WORKAROUND: Node 25 and later stopped bundling corepack, so install it when the image lacks it.
    image: node:26-bookworm
    depends_on: [install]
    commands:
      - command -v corepack >/dev/null || npm install --global corepack
      - corepack enable
      - bash scripts/gate-slot.sh pnpm test
  - <<: *step
    name: lint
    depends_on: [install]
    commands:
      - corepack enable
      - bash scripts/gate-slot.sh pnpm lint
  - <<: *step
    name: format
    depends_on: [install]
    commands:
      - corepack enable
      - bash scripts/gate-slot.sh pnpm format:check
  # Unused dependencies, layering (depcruise, errors) and duplication (jscpd, fails above its threshold) budgets.
  - <<: *step
    name: static-checks
    depends_on: [install]
    commands:
      - corepack enable
      - bash scripts/gate-slot.sh pnpm run depcheck
      - bash scripts/gate-slot.sh pnpm depcruise
      - bash scripts/gate-slot.sh pnpm jscpd:check
  # Example commands and config blocks in the README and docs: BROWX_* names, CLI subcommands and flags, MCP config JSON. This step has no dist/, so the CLI probes are skipped; package-contents repeats the check after the build and runs them.
  - <<: *step
    name: examples
    depends_on: [install]
    commands:
      - bash scripts/gate-slot.sh node scripts/check-examples.mjs
  # Supply-chain checks (dependency scan, licenses, lockfile); the scan needs the network, so it stays off the lint and test steps.
  - <<: *step
    name: supply-chain
    depends_on: [install]
    commands:
      - corepack enable
      - bash scripts/gate-slot.sh pnpm audit:prod
      - bash scripts/gate-slot.sh pnpm licenses:check
      - bash scripts/gate-slot.sh node scripts/lockfile-lint.mjs
  - <<: *step
    name: package-contents
    image: node:26-bookworm
    depends_on: [install]
    commands:
      - command -v corepack >/dev/null || npm install --global corepack
      - corepack enable
      - bash scripts/gate-slot.sh pnpm build
      - bash scripts/gate-slot.sh node scripts/audit-package-contents.mjs
      - bash scripts/gate-slot.sh node scripts/check-examples.mjs

  # Push to main: the head commit must be the squash merge of a gated PR.
  - name: main-check
    image: node:26-bookworm
    depends_on: []
    when:
      - event: push
        branch: main
    commands:
      - set -eu
      - git log -1 --format='%H %s'
      - 'git log -1 --format=%s | grep -Eq "\(#[0-9]+\)$" || { echo "main-check: the head commit is not a PR squash merge, nothing proves it was gated" >&2; exit 1; }'
      - 'echo "main-check ok: tree gated before the merge, no rebuild"'

  # secret-scan: trufflehog 3.99.3. Only this step and zizmor mount the tools cache; no secret is used. SECURITY: the release asset is cached on the host, its sha256 is checked on every run and the binary is unpacked fresh from the verified file; a mismatch fails the step.
  - name: secret-scan
    image: node:26-bookworm
    depends_on: []
    when: *gate-when
    volumes:
      - /home/gitops/cache/browxai/tools:/tools
      - /srv/trackxai-gate-locks:/srv/trackxai-gate-locks
    commands:
      # NOTE: no brace-style variable references in this file, Woodpecker substitutes those in the YAML before the shell sees them.
      - |
        set -eu
        ASSET=trufflehog_3.99.3_linux_amd64.tar.gz
        SHA256=029b182e0ed35fd5b02cd1eadc2a94bd457ab14ad22a9380b6e5d9652261d28d
        DIR=/tools/trufflehog-3.99.3
        mkdir -p $DIR
        if [ ! -f $DIR/$ASSET ]; then
          curl --fail --silent --show-error --location --retry 3 --output $DIR/$ASSET.part https://github.com/trufflesecurity/trufflehog/releases/download/v3.99.3/$ASSET
          mv $DIR/$ASSET.part $DIR/$ASSET
        fi
        if ! echo "$SHA256  $DIR/$ASSET" | sha256sum --check --strict; then
          echo "secret-scan: sha256 of $DIR/$ASSET does not match the pinned value, refusing to run it" >&2
          exit 1
        fi
        BIN=$(mktemp -d)
        tar -xzf $DIR/$ASSET -C $BIN trufflehog
        git config --global --add safe.directory $CI_WORKSPACE
        # Scan range: the pushed commits, or the whole history when the push has no usable base.
        HEAD_SHA=$CI_COMMIT_SHA
        # Woodpecker leaves CI_PREV_COMMIT_SHA unset on the first push of a branch; read it without tripping set -u.
        BASE_SHA=$(printenv CI_PREV_COMMIT_SHA || true)
        case "$BASE_SHA" in 0000000000000000000000000000000000000000) BASE_SHA="" ;; esac
        if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" = "$HEAD_SHA" ]; then
          echo "secret-scan: push adds no commits, nothing to scan"
          exit 0
        fi
        if [ -n "$BASE_SHA" ] && ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
          echo "secret-scan: base $BASE_SHA is not in the clone, scanning the whole history of $HEAD_SHA"
          BASE_SHA=""
        fi
        if [ -n "$BASE_SHA" ]; then
          bash scripts/gate-slot.sh $BIN/trufflehog git file://$CI_WORKSPACE --since-commit $BASE_SHA --branch $HEAD_SHA --fail --no-update --results=verified,unknown
        else
          bash scripts/gate-slot.sh $BIN/trufflehog git file://$CI_WORKSPACE --branch $HEAD_SHA --fail --no-update --results=verified,unknown
        fi

  # zizmor 1.16.3, persona auditor, min-severity low, gating.
  # WORKAROUND: zizmor's online audits need a GitHub token; no secret is used here, so they are off (--no-online-audits).
  - name: zizmor
    image: node:26-bookworm
    depends_on: []
    when: *gate-when
    volumes:
      - /home/gitops/cache/browxai/tools:/tools
      - /srv/trackxai-gate-locks:/srv/trackxai-gate-locks
    commands:
      - |
        set -eu
        ASSET=zizmor-x86_64-unknown-linux-gnu.tar.gz
        SHA256=f0070985e94dd7b29e30abe249f6c7b2f14078c35a8f2de78e2d6ce89de0c132
        DIR=/tools/zizmor-1.16.3
        mkdir -p $DIR
        if [ ! -f $DIR/$ASSET ]; then
          curl --fail --silent --show-error --location --retry 3 --output $DIR/$ASSET.part https://github.com/zizmorcore/zizmor/releases/download/v1.16.3/$ASSET
          mv $DIR/$ASSET.part $DIR/$ASSET
        fi
        if ! echo "$SHA256  $DIR/$ASSET" | sha256sum --check --strict; then
          echo "zizmor: sha256 of $DIR/$ASSET does not match the pinned value, refusing to run it" >&2
          exit 1
        fi
        BIN=$(mktemp -d)
        tar -xzf $DIR/$ASSET -C $BIN
        bash scripts/gate-slot.sh $BIN/zizmor --persona=auditor --min-severity=low --no-online-audits --color=never -- .
