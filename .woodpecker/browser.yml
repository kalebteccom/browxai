# ci-optimised: v1
# Real Chromium, Firefox and WebKit keystones in three shards, on the browser-runner agent: it only takes a workflow with `labels: browser: "true"` (3 workflows at once; per step 24 GB RAM, 8 CPUs, 4 GB /dev/shm). Steps of one workflow run in parallel; this file assumes the agent runs 3 keystone steps at once. Android needs a USB device and Safari needs macOS, so those keystones still skip and run manually.
# Same rules as gate.yml: push events only (the repo is public), heavy commands through scripts/gate-slot.sh, images by exact tag, no brace-style variable references. Runs in parallel with gate.yml on every branch except main; a push to main only runs `main-check` there.
labels:
  browser: "true"
when:
  - event: push
    branch:
      exclude: [main]
# Workspaces are per workflow, so this file installs for itself (the pnpm store is cached on the host). After `install`, the example-plugin build and the browser download run in parallel (only the download writes the shared browser cache), and the shards start when both are done.
steps:
  - &step
    name: install
    image: node:22-bookworm
    depends_on: []
    volumes:
      - /home/gitops/cache/browxai/pnpm-store:/pnpm-store
      - /home/gitops/cache/browxai/corepack:/corepack
      - /home/gitops/cache/browxai/playwright-browsers:/playwright-browsers
      - /srv/trackxai-gate-locks:/srv/trackxai-gate-locks
    environment:
      COREPACK_HOME: /corepack
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      PLAYWRIGHT_BROWSERS_PATH: /playwright-browsers
      npm_config_store_dir: /pnpm-store
    commands:
      - corepack enable
      - bash scripts/gate-slot.sh pnpm install --frozen-lockfile
  # plugin-runtime.keystone.test.ts copies packages/plugins/example/dist/ into a staged workspace and fails with ENOENT without it. No other keystone reads dist/, so only that package is built; the full build stays in gate.yml (package-contents).
  - <<: *step
    name: plugin-build
    depends_on: [install]
    commands:
      - corepack enable
      - bash scripts/gate-slot.sh pnpm --filter ./packages/plugins/example build
  # WORKAROUND: the only playwright image on the box is older than the playwright-core the lockfile pins, so a plain node image downloads the matching browsers into the cache volume.
  - <<: *step
    name: browsers
    depends_on: [install]
    commands:
      - corepack enable
      - bash scripts/gate-slot.sh pnpm exec playwright-core install chromium firefox webkit
  # OS libraries live in the container, not in the browser cache, so each shard installs them itself.
  - &shard
    <<: *step
    name: keystone-1
    image: node:26-bookworm
    depends_on: [plugin-build, browsers]
    commands:
      - command -v corepack >/dev/null || npm install --global corepack
      - corepack enable
      - bash scripts/gate-slot.sh pnpm exec playwright-core install-deps chromium firefox webkit
      - bash scripts/gate-slot.sh pnpm test:keystone --shard=$(echo $CI_STEP_NAME | tr -dc 1-9)/3
  - <<: *shard
    name: keystone-2
  - <<: *shard
    name: keystone-3
