# ci-optimised: v1
# First-run check of the PUBLISHED package, nothing built from this checkout: a clean `npm install browxai@latest` in an empty temp directory, the getting-started page followed step by step with the commands it shows, a first snapshot, the tools/list sizes, and the documented paths the first flow does not reach. MANUAL ONLY: it never runs on push, it is not part of `woodpecker.yml` (`depends_on: [gate, browser]` there does not list it), and it is not a required check. Start it from the Woodpecker UI or `woodpecker-cli pipeline create --branch <branch> --var AUDIT=<design|lighthouse|first-run|shots> <repo>` when the queue is empty.
# Step 1, CLEAN INSTALL: `npm init -y`, `npm install browxai@latest` (exact version and install time recorded, cold npm cache), `npx browxai --version`, `browxai doctor` and `browxai doctor --verbose` before and after the browser download, the browser command the page shows (`npx playwright-core@<pin> install chromium`, size and time recorded) and its `--with-deps` variant, then `browxai init` with the flags the page mentions (`--no-write`, `--no-write-user-config`, `--no-smoke`, `--write-user-config`, and `init .` with the smoke test). Each command prints its exit code, wall time and the first 25 lines of output (fewer when the block would pass its size budget), and every difference from what the page says is listed as DIFF: the strings the page quotes (`✓ first snapshot in N ms`, the pinned playwright-core version, about 150 MB, Node 22 or newer, the `.browxai-bak` copy) are read from website/src/content/docs/getting-started.md at run time.
# Step 2, FIRST SNAPSHOT: browxai started over stdio as a client config starts it, driven by a small stdio client (scripts/first-run/mcp-client.mjs) against a static form page on 127.0.0.1: open_session, navigate, snapshot, find, fill, find, click, snapshot, close_session, with the time and result size of each call. It also records the headed launch with no display (the page says it fails until BROWX_HEADLESS=1) and runs the README SDK quickstart (createBrowxai, navigate, extract) against the same page.
# Step 3, TOOL LIST SIZES: tools/list over stdio with BROWX_TOOL_LIST unset (all) and `enabled`, with the default capabilities and with every documented capability: tool count, characters (JSON length of the result) and an ESTIMATED token count (characters divided by 4). The server refuses the full capability set without a host daemon socket (operator-channel, live-view); the table then uses the other 21 and says so.
# Step 4, DOCUMENTED PATHS: six parts, each independent, comparing the package with what the README, the guides and docs/tool-reference.md promise (the quoted strings and flags are read from those files at run time). (1) `browxai serve --socket <path>` and two SDK clients attached by `endpoint: "unix://<path>"`: a session client A opens is listed by client B and B can snapshot its page, closing B (its own session and its connection) leaves A working, the socket is owner-only, and the count of Chrome main processes is recorded before, after A, after B and after both close. (2) The SDK `transport: "stdio-child"`: navigate, snapshot, close, then the child and its Chrome must be gone from /proc (the SDK does not expose the exit status). (3) `browxai plugin` help, list and sync on an empty workspace, then the registry install of @browxai/plugin-example, list, info, upgrade, `doctor`, `plugins_list` over MCP and remove; the `file:` install of packages/plugins is not run, the package ships dist/ only. (4) `eval_js` with the default capabilities: the refusal text and hint against the troubleshooting page, `set_config` cannot enable it, `BROWX_TOOL_LIST=enabled` hides it but a call by name returns the same refusal, then a restart with the page's BROWX_CAPABILITIES line and the call runs. (5) `doctor` with BROWX_ATTACH_CDP on a closed port: the attach area, its next step and the verbose cdp-attach row. (6) `browxai --help` and `browxai chrome start --help` show every flag and command the docs name.
# Exit status: 0 the commands ran as documented, 1 a documented command failed or differs from the page, 2 a tool error (the registry or the browser CDN is not reachable, the fence check failed, a script crashed, a part that needs a browser was skipped). The worst of the four sections wins.
# Output: the step log is the only readable result. Each section prints one block between `===== FIRST-RUN BEGIN =====` and `===== FIRST-RUN END =====`: the plain text, then the same text again as `FRINSTALL|n|`, `FRSNAP|n|`, `FRSIZES|n|` or `FRPATHS|n|` lines of about 1.5 KB, so a log service that drops a long line loses nothing. The four blocks together stay under 30 KB (their plain text under 14 KB, split by BUDGETS in scripts/first-run/block.mjs), and the full command logs are in .audit/first-run/ on the agent.
# Like browser.yml this runs on the browser-runner agent (label below). No secrets, nothing installed globally, no GitHub Actions. The work happens in a temp directory with a throwaway HOME and npm cache, with telemetry and update notices off.
# EGRESS: the npm registry, the Playwright browser CDN (the browser download) and the distro package mirrors (the page's --with-deps command) are reached in step 1, before any browser starts. Step 4 reaches the npm registry once more, for the first-party plugin install, with no browser running. Chrome only starts after scripts/first-run/fence-browsers.sh put the design-audit wrapper (scripts/design-audit/fence.sh: non-loopback hosts do not resolve, non-loopback requests go to a dead proxy) in front of every Chrome binary Playwright downloaded, and scripts/first-run/fence-check.mjs proved it on a loopback page; steps 2 and 4 start no browser without that proof (step 3 starts none). The only pages loaded are the fixtures on 127.0.0.1.
# Same rules as gate.yml: heavy commands through scripts/gate-slot.sh, images by exact tag, no brace-style variable references (Woodpecker substitutes those in the YAML before the shell sees them), all logic in scripts/first-run/.
labels:
  browser: "true"
# A manual run starts one audit: pass the variable AUDIT with the value design, lighthouse, first-run or shots (API: {"branch":"main","variables":{"AUDIT":"..."}}). Without it none of them starts, so they never run at the same time.
when:
  - event: manual
    evaluate: 'AUDIT == "first-run"'
steps:
  # One step, because the four sections share the temp directory, the downloaded browser and the fence, and a documented difference in section 1 (exit 1) must not stop the others. run.sh prints the four blocks and a final `FIRST-RUN RESULT` line.
  - name: first-run
    image: node:26-bookworm
    volumes:
      - /srv/trackxai-gate-locks:/srv/trackxai-gate-locks
    environment:
      GATE_STEP_BUDGET_SECS: "3000"
    commands:
      - bash scripts/gate-slot.sh bash scripts/first-run/run.sh .audit
