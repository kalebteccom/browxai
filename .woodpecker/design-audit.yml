# ci-optimised: v1
# Rendered design audit of the docs site (website/dist) with two pinned third-party tools: impeccable engine-v0.1.17 and hallmark 7ec86822 (sloplint --render, via puppeteer-core 25.16.0). MANUAL ONLY: it never runs on push, it is not part of `woodpecker.yml` (`depends_on: [gate, browser]` there does not list it), and it is not a required check. Start it from the Woodpecker UI or `woodpecker-cli pipeline create --branch <branch> <repo>` when the queue is empty.
# Output: the step log is the only readable result. The `audit` step prints one block between DESIGN-AUDIT FINDINGS BEGIN and END and exits non-zero when it has findings or a tool failed.
# Like browser.yml this runs on the browser-runner agent (label below). No secrets, nothing installed globally, no GitHub Actions. Neither tool installs a hook or writes PRODUCT.md or DESIGN.md; hallmark redesign, install-hook, imagegen and audit are never run.
# EGRESS: the only network use outside the loopback fixture is the download step (github.com, npm registry), before any browser starts. Chrome only starts through scripts/design-audit/fence.sh's wrapper (non-loopback hosts do not resolve, non-loopback requests go to a dead proxy). The `fence-test` step fails the run if a page reaches a non-loopback URL.
# Same rules as gate.yml: heavy commands through scripts/gate-slot.sh, images by exact tag, no brace-style variable references (Woodpecker substitutes those in the YAML before the shell sees them), all logic in scripts/design-audit/.
labels:
  browser: "true"
when:
  - event: manual
steps:
  # (1) Install and build the docs site, and fetch the browser build the cache volume holds for playwright-core.
  - &step
    name: build
    image: node:26-bookworm
    depends_on: []
    volumes:
      - /home/gitops/cache/browxai/pnpm-store:/pnpm-store
      - /home/gitops/cache/browxai/corepack:/corepack
      - /home/gitops/cache/browxai/playwright-browsers:/playwright-browsers
      - /srv/trackxai-gate-locks:/srv/trackxai-gate-locks
    environment:
      COREPACK_HOME: /corepack
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      PLAYWRIGHT_BROWSERS_PATH: /playwright-browsers
      npm_config_store_dir: /pnpm-store
    commands:
      - command -v corepack >/dev/null || npm install --global corepack
      - corepack enable
      - bash scripts/gate-slot.sh pnpm install --frozen-lockfile
      - bash scripts/gate-slot.sh pnpm docs:build
      - bash scripts/gate-slot.sh pnpm exec playwright-core install chromium
  # (2) and (3) impeccable binary (sha256 checked, fail closed), hallmark at the pinned commit (three file hashes checked), puppeteer-core 25.16.0 with --ignore-scripts. Runs beside `build`; it only writes .audit/tools.
  - <<: *step
    name: tools
    commands:
      - bash scripts/gate-slot.sh bash scripts/design-audit/fetch-tools.sh .audit/tools
  # (5, part 1) Wrapper test: a fixture page on 127.0.0.1 that references three non-loopback URLs. Every one of them must fail and the loopback stylesheet must load, else this step (and the run) fails. Also records whether dark mode can be emulated.
  - <<: *step
    name: fence-test
    depends_on: [build, tools]
    commands:
      - command -v corepack >/dev/null || npm install --global corepack
      - corepack enable
      - bash scripts/gate-slot.sh pnpm exec playwright-core install-deps chromium
      - "bash scripts/design-audit/fence.sh .audit > .audit/wrapper.path"
      - 'node scripts/design-audit/fence-test.mjs .audit/tools/puppeteer "$(cat .audit/wrapper.path)" .audit/themes'
  # (4), (5) part 2 and (6) Serve website/dist on 127.0.0.1:4321, run impeccable at 320, 390 and 1440 and hallmark --render on /, /404.html, one guide, troubleshooting, tool-reference and threat-model, light and dark (light only when the fence test could not emulate dark), print the findings block.
  - <<: *step
    name: audit
    depends_on: [fence-test]
    environment:
      COREPACK_HOME: /corepack
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      PLAYWRIGHT_BROWSERS_PATH: /playwright-browsers
      npm_config_store_dir: /pnpm-store
      GATE_STEP_BUDGET_SECS: "3000"
    commands:
      - command -v corepack >/dev/null || npm install --global corepack
      - corepack enable
      - bash scripts/gate-slot.sh pnpm exec playwright-core install-deps chromium
      - bash scripts/gate-slot.sh bash scripts/design-audit/run-audit.sh .audit
