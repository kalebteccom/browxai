# ci-optimised: v1
# Screenshots of the docs site (website/dist): the home page `/` and `/getting-started/`, each at 390x844 (device scale factor 2) and 1280x800 (scale 1), in light and dark (Playwright's colorScheme option), full page clipped to 3000 CSS pixels, 8 images in all. MANUAL ONLY: it never runs on push, it is not part of `woodpecker.yml` (`depends_on: [gate, browser, tests]` there does not list it), and it is not a required check. Start it from the Woodpecker UI or `woodpecker-cli pipeline create --branch <branch> --var AUDIT=<design|lighthouse|first-run|shots> <repo>` when the queue is empty.
# Output: the step log is the only readable result. The `shots` step prints each image as `SHOT-BEGIN <name> <bytes>`, the base64 in 76-character lines, `SHOT-END`, then `SHOT-LIST` lines (names and sizes), then one `SHOT-FACT` line per image: document scroll width against viewport width (overflow-x), the number of elements wider than the viewport, the h1 text, the number of words visible in the first screen. Save the log and run `python3 -I scripts/shots/decode-log.py <log-file> <out-dir>` to get the files. The images and the whole log are also in .audit/shots/ on the agent.
# Images are WebP at quality 72, encoded with sharp (a dev dependency of the website workspace). The SHOT-FACT line marks any image over 60 KB. If sharp cannot be loaded the images stay PNG and the log says so.
# Like browser.yml this runs on the browser-runner agent (label below). No secrets, nothing installed globally, no GitHub Actions.
# EGRESS: the only network use is in the build step (npm registry, Playwright browser CDN), before any browser starts. Chrome only starts through scripts/design-audit/fence.sh's wrapper (non-loopback hosts do not resolve, non-loopback requests go to a dead proxy). The `fence-check` step fails the run if a page reaches a non-loopback URL or if colour scheme emulation does not work.
# Same rules as gate.yml: heavy commands through scripts/gate-slot.sh, images by exact tag, no brace-style variable references (Woodpecker substitutes those in the YAML before the shell sees them), all logic in scripts/shots/.
labels:
  browser: "true"
# A manual run starts one audit: pass the variable AUDIT with the value design, lighthouse, first-run or shots (API: {"branch":"main","variables":{"AUDIT":"..."}}). Without it none of the four starts, so they never run at the same time.
when:
  - event: manual
    evaluate: 'AUDIT == "shots"'
steps:
  # (1) Install and build the docs site, and fetch the browser build the cache volume holds for playwright-core.
  - &step
    name: build
    image: node:26-bookworm
    depends_on: []
    volumes:
      - /home/gitops/cache/browxai/pnpm-store:/pnpm-store
      - /home/gitops/cache/browxai/corepack:/corepack
      - /home/gitops/cache/browxai/playwright-browsers:/playwright-browsers
      - /srv/trackxai-gate-locks:/srv/trackxai-gate-locks
    environment:
      COREPACK_HOME: /corepack
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      PLAYWRIGHT_BROWSERS_PATH: /playwright-browsers
      npm_config_store_dir: /pnpm-store
    commands:
      - command -v corepack >/dev/null || npm install --global corepack
      - corepack enable
      - bash scripts/gate-slot.sh pnpm install --frozen-lockfile
      - bash scripts/gate-slot.sh pnpm docs:build
      - bash scripts/gate-slot.sh pnpm exec playwright-core install chromium
  # (2) Fence check: write the Chrome wrapper, then a page on 127.0.0.1 that references three non-loopback URLs. Every one of them must fail, the loopback image must load and dark emulation must work, else this step (and the run) fails.
  - <<: *step
    name: fence-check
    depends_on: [build]
    commands:
      - command -v corepack >/dev/null || npm install --global corepack
      - corepack enable
      - bash scripts/gate-slot.sh pnpm exec playwright-core install-deps chromium
      - mkdir -p .audit
      - "bash scripts/design-audit/fence.sh .audit > .audit/wrapper.path"
      - 'bash scripts/gate-slot.sh node scripts/shots/fence-check.mjs "$(cat .audit/wrapper.path)" .audit'
  # (3) Serve website/dist on 127.0.0.1:4323, capture the 8 images, print the blocks, the list and the facts.
  - <<: *step
    name: shots
    depends_on: [fence-check]
    environment:
      COREPACK_HOME: /corepack
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      PLAYWRIGHT_BROWSERS_PATH: /playwright-browsers
      npm_config_store_dir: /pnpm-store
      GATE_STEP_BUDGET_SECS: "900"
    commands:
      - command -v corepack >/dev/null || npm install --global corepack
      - corepack enable
      - bash scripts/gate-slot.sh pnpm exec playwright-core install-deps chromium
      - bash scripts/gate-slot.sh bash scripts/shots/run.sh .audit
