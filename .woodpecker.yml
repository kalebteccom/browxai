# ci-optimised: v1
# Woodpecker is the only CI for this repo; the one GitHub workflow left is release.yml (OIDC publish), which has no equivalent here.
# secret-scan and zizmor download pinned release binaries into a host cache (neither tool ships in a node image).
# INVARIANT: every heavy command goes through scripts/gate-slot.sh, which draws from the slot pool shared with trackxai and remotxai.
# INVARIANT: no step builds an image; images are pulled by exact tag.
# The repo is public, so Woodpecker never runs pull_request events; a branch is gated by the pipeline of its push.
# GATE vs MAIN: every gate step runs on pushes to any branch except main, once, before the merge. A push to main runs only `main-check`:
# the squash merge landed a tree that was gated at the same head, so nothing is rebuilt.
when:
  - event: push

# WORKAROUND: Woodpecker steps share one workspace, so two steps that run `pnpm install` at once would race on node_modules.
# `install` therefore runs once, first, and every step that needs node_modules depends on it; those steps then run in parallel.
# No installed dependency is bound to the Node ABI: install scripts are off (.npmrc) and the only native code, sharp, ships Node-API prebuilds as per-platform packages; so one install under Node 22 serves the Node 26 steps.
steps:
  - name: install
    # WORKAROUND: the trackxai-ci images carry pnpm 9.15.9 but package.json pins pnpm@9.0.0, so plain node images plus corepack honour `packageManager`.
    image: node:22-bookworm
    depends_on: []
    when: &gate-when
      - event: push
        branch:
          exclude: [main]
    volumes: &pnpm-volumes
      - /home/gitops/cache/browxai/pnpm-store:/pnpm-store
      - /home/gitops/cache/browxai/corepack:/corepack
      - /srv/trackxai-gate-locks:/srv/trackxai-gate-locks
    environment: &pnpm-env
      COREPACK_HOME: /corepack
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    commands:
      - corepack enable
      - pnpm config set store-dir /pnpm-store
      - bash scripts/gate-slot.sh pnpm install --frozen-lockfile

  # Node 22 is the declared floor in `engines` (the Safari BiDi client uses Node's global WebSocket); 26 is what development runs on.
  - name: build-node22
    image: node:22-bookworm
    depends_on: [install]
    when: *gate-when
    volumes: *pnpm-volumes
    environment: *pnpm-env
    commands:
      - corepack enable
      - pnpm config set store-dir /pnpm-store
      - bash scripts/gate-slot.sh pnpm typecheck
      - bash scripts/gate-slot.sh pnpm test

  # Unit suite on the development Node. No typecheck here: it runs no code, build-node22 already does it.
  - name: build-node26
    # WORKAROUND: Node 25 and later stopped bundling corepack, so install it when the image lacks it.
    image: node:26-bookworm
    depends_on: [install]
    when: *gate-when
    volumes: *pnpm-volumes
    environment: *pnpm-env
    commands:
      - command -v corepack >/dev/null || npm install --global corepack
      - corepack enable
      - pnpm config set store-dir /pnpm-store
      - bash scripts/gate-slot.sh pnpm test

  # Lint, formatting, unused dependencies, layering (depcruise) and duplication (jscpd) budgets, then the supply-chain checks (audit, licenses, lockfile).
  - name: quality
    image: node:26-bookworm
    depends_on: [install]
    when: *gate-when
    volumes: *pnpm-volumes
    environment: *pnpm-env
    commands:
      - command -v corepack >/dev/null || npm install --global corepack
      - corepack enable
      - pnpm config set store-dir /pnpm-store
      - bash scripts/gate-slot.sh pnpm lint
      - bash scripts/gate-slot.sh pnpm format:check
      - bash scripts/gate-slot.sh pnpm run depcheck
      # depcruise and jscpd are enforced: layering rules are errors, jscpd fails above its duplication threshold.
      - bash scripts/gate-slot.sh pnpm depcruise
      - bash scripts/gate-slot.sh pnpm jscpd:check
      - bash scripts/gate-slot.sh pnpm audit:prod
      - bash scripts/gate-slot.sh pnpm licenses:check
      - bash scripts/gate-slot.sh node scripts/lockfile-lint.mjs

  - name: package-contents
    image: node:26-bookworm
    depends_on: [install]
    when: *gate-when
    volumes: *pnpm-volumes
    environment: *pnpm-env
    commands:
      - command -v corepack >/dev/null || npm install --global corepack
      - corepack enable
      - pnpm config set store-dir /pnpm-store
      - bash scripts/gate-slot.sh pnpm build
      - bash scripts/gate-slot.sh node scripts/audit-package-contents.mjs

  # Push to main: the head commit must be the squash merge of a gated PR.
  - name: main-check
    image: node:26-bookworm
    depends_on: []
    when:
      - event: push
        branch: main
    commands:
      - set -eu
      - git log -1 --format='%H %s'
      - 'git log -1 --format=%s | grep -Eq "\(#[0-9]+\)$" || { echo "main-check: the head commit is not a PR squash merge, nothing proves it was gated" >&2; exit 1; }'
      - 'echo "main-check ok: tree gated before the merge, no rebuild"'

  # secret-scan: trufflehog 3.97.9.
  # SECURITY: the release asset is cached on the host, its sha256 is checked on every run and the binary is unpacked fresh from the verified file; a mismatch fails the step.
  # Only this step and zizmor mount the tools cache. No secret is used.
  - name: secret-scan
    image: node:26-bookworm
    depends_on: []
    when: *gate-when
    volumes:
      - /home/gitops/cache/browxai/tools:/tools
      - /srv/trackxai-gate-locks:/srv/trackxai-gate-locks
    commands:
      # NOTE: no brace-style variable references in this file, Woodpecker substitutes those in the YAML before the shell sees them.
      - |
        set -eu
        ASSET=trufflehog_3.97.9_linux_amd64.tar.gz
        SHA256=40377e6572495412fb9ba0bc21c9401f73b72f1d2afd11b9931bc4a5ed622866
        DIR=/tools/trufflehog-3.97.9
        mkdir -p $DIR
        if [ ! -f $DIR/$ASSET ]; then
          curl --fail --silent --show-error --location --retry 3 --output $DIR/$ASSET.part https://github.com/trufflesecurity/trufflehog/releases/download/v3.97.9/$ASSET
          mv $DIR/$ASSET.part $DIR/$ASSET
        fi
        if ! echo "$SHA256  $DIR/$ASSET" | sha256sum --check --strict; then
          echo "secret-scan: sha256 of $DIR/$ASSET does not match the pinned value, refusing to run it" >&2
          exit 1
        fi
        BIN=$(mktemp -d)
        tar -xzf $DIR/$ASSET -C $BIN trufflehog
        git config --global --add safe.directory $CI_WORKSPACE
        # Scan range: the pushed commits, or the whole history when the push has no usable base.
        HEAD_SHA=$CI_COMMIT_SHA
        # Woodpecker leaves CI_PREV_COMMIT_SHA unset on the first push of a branch; read it without tripping set -u.
        BASE_SHA=$(printenv CI_PREV_COMMIT_SHA || true)
        case "$BASE_SHA" in 0000000000000000000000000000000000000000) BASE_SHA="" ;; esac
        if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" = "$HEAD_SHA" ]; then
          echo "secret-scan: push adds no commits, nothing to scan"
          exit 0
        fi
        if [ -n "$BASE_SHA" ] && ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
          echo "secret-scan: base $BASE_SHA is not in the clone, scanning the whole history of $HEAD_SHA"
          BASE_SHA=""
        fi
        if [ -n "$BASE_SHA" ]; then
          bash scripts/gate-slot.sh $BIN/trufflehog git file://$CI_WORKSPACE --since-commit $BASE_SHA --branch $HEAD_SHA --fail --no-update --results=verified,unknown
        else
          bash scripts/gate-slot.sh $BIN/trufflehog git file://$CI_WORKSPACE --branch $HEAD_SHA --fail --no-update --results=verified,unknown
        fi

  # zizmor 1.16.3, persona auditor, min-severity low, gating.
  # WORKAROUND: zizmor's online audits need a GitHub token; no secret is used here, so they are off (--no-online-audits).
  - name: zizmor
    image: node:26-bookworm
    depends_on: []
    when: *gate-when
    volumes:
      - /home/gitops/cache/browxai/tools:/tools
      - /srv/trackxai-gate-locks:/srv/trackxai-gate-locks
    commands:
      - |
        set -eu
        ASSET=zizmor-x86_64-unknown-linux-gnu.tar.gz
        SHA256=f0070985e94dd7b29e30abe249f6c7b2f14078c35a8f2de78e2d6ce89de0c132
        DIR=/tools/zizmor-1.16.3
        mkdir -p $DIR
        if [ ! -f $DIR/$ASSET ]; then
          curl --fail --silent --show-error --location --retry 3 --output $DIR/$ASSET.part https://github.com/zizmorcore/zizmor/releases/download/v1.16.3/$ASSET
          mv $DIR/$ASSET.part $DIR/$ASSET
        fi
        if ! echo "$SHA256  $DIR/$ASSET" | sha256sum --check --strict; then
          echo "zizmor: sha256 of $DIR/$ASSET does not match the pinned value, refusing to run it" >&2
          exit 1
        fi
        BIN=$(mktemp -d)
        tar -xzf $DIR/$ASSET -C $BIN
        bash scripts/gate-slot.sh $BIN/zizmor --persona=auditor --min-severity=low --no-online-audits --color=never -- .

  # Real Chromium, Firefox and WebKit, in two shards. Android needs a USB device and Safari needs macOS, so those keystones still skip and run manually.
  # The gate-slot pool bounds how many heavy commands run at once, so the shards do not wait for the unit steps. Browsers are installed once, in `browsers`, before the shards start: two shards installing into the shared cache volume would race.
  - name: browsers
    # WORKAROUND: the only playwright image on the box is v1.60.0-noble while the lockfile pins playwright-core 1.63.0, so a plain node image installs the matching browsers (and their OS deps) into the cache volume.
    image: node:26-bookworm
    depends_on: [install]
    when: *gate-when
    volumes: &browser-volumes
      - /home/gitops/cache/browxai/pnpm-store:/pnpm-store
      - /home/gitops/cache/browxai/corepack:/corepack
      - /home/gitops/cache/browxai/playwright-browsers:/playwright-browsers
      - /srv/trackxai-gate-locks:/srv/trackxai-gate-locks
    environment: &browser-env
      COREPACK_HOME: /corepack
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      PLAYWRIGHT_BROWSERS_PATH: /playwright-browsers
    commands:
      - command -v corepack >/dev/null || npm install --global corepack
      - corepack enable
      - pnpm config set store-dir /pnpm-store
      - bash scripts/gate-slot.sh pnpm exec playwright-core install --with-deps chromium firefox webkit

  # plugin-runtime.keystone.test.ts copies packages/plugins/example/dist/ into a staged workspace and fails with ENOENT without it. dist comes from package-contents (it runs `pnpm build` in the shared workspace), so both shards depend on it.
  - name: keystone-1
    image: node:26-bookworm
    depends_on: [install, package-contents, browsers]
    when: *gate-when
    volumes: *browser-volumes
    environment: *browser-env
    commands:
      - command -v corepack >/dev/null || npm install --global corepack
      - corepack enable
      - pnpm config set store-dir /pnpm-store
      - bash scripts/gate-slot.sh pnpm test:keystone --shard=1/2

  - name: keystone-2
    image: node:26-bookworm
    depends_on: [install, package-contents, browsers]
    when: *gate-when
    volumes: *browser-volumes
    environment: *browser-env
    commands:
      - command -v corepack >/dev/null || npm install --global corepack
      - corepack enable
      - pnpm config set store-dir /pnpm-store
      - bash scripts/gate-slot.sh pnpm test:keystone --shard=2/2
